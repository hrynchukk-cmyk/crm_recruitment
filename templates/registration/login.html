{% extends "base.html" %}
{% block title %}Вхід — CRM рекрутингу{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-brand">
    <span class="brand-mark large" aria-hidden="true">Р</span>
    <div>
      <div class="auth-title">CRM рекрутингу</div>
      <div class="muted small">Вакансії та кандидати в одному місці</div>
    </div>
  </div>
  {% if form.errors %}<div class="errorlist">Невірний логін або пароль.</div>{% endif %}
  <form method="post" class="form">
    {% csrf_token %}
    <div class="field"><label for="id_username">Логін</label>{{ form.username }}</div>
    <div class="field"><label for="id_password">Пароль</label>{{ form.password }}</div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primary block">Увійти</button>
  </form>
</div>
{% endblock %}
