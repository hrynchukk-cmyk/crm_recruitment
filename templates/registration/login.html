{% extends "base.html" %}
{% block title %}Вхід — CRM рекрутингу{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Вхід</h1>
  {% if form.errors %}<p class="error">Невірний логін або пароль.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Логін {{ form.username }}</label>
    <label>Пароль {{ form.password }}</label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primary">Увійти</button>
  </form>
</div>
{% endblock %}
